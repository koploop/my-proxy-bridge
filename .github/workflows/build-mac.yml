name: Build macOS
permissions:
  contents: read

# only run when macOS app/extension sources (or this workflow) change
on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'ProxyBridge/**'
      - 'extension/**'
      - 'ProxyBridge.xcodeproj/**'
      - '.github/workflows/build-mac.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'ProxyBridge/**'
      - 'extension/**'
      - 'ProxyBridge.xcodeproj/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: latest-stable

    # Unsigned build: development provisioning cannot work on ephemeral CI
    # runners (device UDID check), so signing happens locally via
    # Scripts/sign-local.sh after downloading the artifact.
    - name: Build Universal Binary (unsigned)
      run: |
        xcodebuild \
          -project ProxyBridge.xcodeproj \
          -scheme ProxyBridge \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGNING_ALLOWED=NO \
          clean build

    - name: Verify Build
      run: |
        APP="build/DerivedData/Build/Products/Release/ProxyBridge.app"
        ls -la build/DerivedData/Build/Products/Release/

        # hard gate: every shipped binary must be universal
        assert_universal() {
          local bin="$1"
          local archs
          archs="$(lipo -archs "$bin")"
          echo "archs of $bin -> $archs"
          if [[ "$archs" != *"arm64"* || "$archs" != *"x86_64"* ]]; then
            echo "::error::$bin is not universal (found: $archs)"
            exit 1
          fi
        }

        assert_universal "$APP/Contents/MacOS/ProxyBridge"
        EXT_DIR=$(find "$APP/Contents/Library/SystemExtensions" -maxdepth 1 -name "*.systemextension" | head -1)
        if [ -z "$EXT_DIR" ]; then
          echo "::error::no system extension embedded in app bundle"
          exit 1
        fi
        assert_universal "$EXT_DIR"/Contents/MacOS/*

        # must be unsigned (signing happens locally)
        if codesign -dv "$APP" 2>/dev/null; then
          echo "::error::app unexpectedly signed; expected unsigned build"
          exit 1
        else
          echo "app is unsigned (expected - sign locally with Scripts/sign-local.sh)"
        fi

    - name: Zip App for Distribution
      run: |
        ditto -c -k --keepParent \
          "build/DerivedData/Build/Products/Release/ProxyBridge.app" \
          ProxyBridge-macOS.zip
        ls -lh ProxyBridge-macOS.zip

    - name: Upload App Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ProxyBridge-macOS
        path: ProxyBridge-macOS.zip
        retention-days: 30
