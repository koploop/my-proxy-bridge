name: Release ProxyBridge macOS
permissions:
  contents: write

# manual only: create the release/tag first, then run this workflow against that tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the app to (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ inputs.tag }}

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: latest-stable

    - name: Build Universal Binary (unsigned)
      run: |
        xcodebuild \
          -project ProxyBridge.xcodeproj \
          -scheme ProxyBridge \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGNING_ALLOWED=NO \
          clean build

    - name: Verify Build
      run: |
        APP="build/DerivedData/Build/Products/Release/ProxyBridge.app"
        ls -la build/DerivedData/Build/Products/Release/

        assert_universal() {
          local bin="$1"
          local archs
          archs="$(lipo -archs "$bin")"
          echo "archs of $bin -> $archs"
          if [[ "$archs" != *"arm64"* || "$archs" != *"x86_64"* ]]; then
            echo "::error::$bin is not universal (found: $archs)"
            exit 1
          fi
        }

        assert_universal "$APP/Contents/MacOS/ProxyBridge"
        EXT_DIR=$(find "$APP/Contents/Library/SystemExtensions" -maxdepth 1 -name "*.systemextension" | head -1)
        if [ -z "$EXT_DIR" ]; then
          echo "::error::no system extension embedded in app bundle"
          exit 1
        fi
        assert_universal "$EXT_DIR"/Contents/MacOS/*

        if ! SIGINFO=$(codesign -dv "$APP" 2>&1); then
          echo "app is unsigned (expected - sign locally with Scripts/sign-local.sh)"
        elif echo "$SIGINFO" | grep -q "adhoc"; then
          echo "app is adhoc-signed (expected - sign locally with Scripts/sign-local.sh)"
        else
          echo "::error::app unexpectedly signed with a real identity"
          exit 1
        fi

    - name: Zip App
      run: |
        ditto -c -k --keepParent \
          "build/DerivedData/Build/Products/Release/ProxyBridge.app" \
          ProxyBridge-macOS.zip

    - name: Upload to Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        gh release upload "$TAG" ProxyBridge-macOS.zip --clobber

    - name: Upload App Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ProxyBridge-macOS
        path: ProxyBridge-macOS.zip
        retention-days: 30
